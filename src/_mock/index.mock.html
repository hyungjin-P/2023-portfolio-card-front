<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' data:; worker-src 'self'; object-src 'none'; base-uri 'self'">
  <!--
    ng serve/build 의 mock configuration 전용 index. 원본 src/index.html 에서
    - Google Tag Manager 스니펫 2벌(head·body)을 뺐다
    - Google Fonts(Roboto·Material Icons) link 와 fonts.gstatic.com preconnect 를 로컬 파일(assets/mock/fonts)로 바꿨다
    - CSP 로 외부 요청을 브라우저가 보내기 전에 막는다. 원본 소스에 박혀 있어 원본 수정 없이는 뺄 수 없는 것들이다.
      · SCSS 의 @import url(Google Fonts) — src/assets/mixins/_font.scss:1 (styles.scss·컴포넌트 스타일이 import)
        → 같은 이름의 @font-face(Noto Sans KR·Poppins·Montserrat)를 로컬 파일로 제공한다
      · browser-image-compression 2.0.2 의 Web Worker 가 jsdelivr CDN 스크립트를 importScripts 한다
        → worker-src 'self' 로 blob 워커 생성을 막아 라이브러리가 메인 스레드 압축으로 폴백한다
      콘솔에 CSP 위반 경고가 남는다.
    - connect-src 의 data: 는 angularx-qrcode 가 자기가 만든 QR data URL 을 fetch 하기 때문이다(네트워크 아님).
    나머지(title·base·viewport·favicon)는 원본과 같다.
  -->
  <title>Portfolio</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- 로컬 폰트·아이콘 (원본: Google Fonts Roboto 300·400·500, Material Icons) -->
  <link href="assets/mock/fonts/fonts.css" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
