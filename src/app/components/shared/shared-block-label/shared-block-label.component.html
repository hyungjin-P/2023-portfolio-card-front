<div class="shared-input-label-wrap">
  <label class="input-text-label"
         (click)="labelClickEvent()">
    {{ label }}
  </label>

  <button class="shared-input-guide"
          matTooltip="사용법 보기"
          type="button"
       (click)="guideClickEvent()"
       *ngIf="guideVisible">
    <img alt="" src="assets/icons/crackit/help.svg">
  </button>

  <div class="shared-input-text-length"
       *ngIf="textLengthVisible">
    <div>{{ nowTextLength | number }}</div>
    <div class="max-length">/{{ maxTextLength | number }}</div>
  </div>
</div>
