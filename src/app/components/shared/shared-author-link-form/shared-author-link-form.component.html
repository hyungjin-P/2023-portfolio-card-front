<div class="shared-author-link-form">
  <label class="input-text-label">
    {{ labelText }}
  </label>

  <mat-form-field class="shared-input-form full-width"
                  [ngClass]=""
                  appearance="outline">

    <div class="prefix-label" matTextPrefix>{{prefixLabel}}</div>

    <input class="shared-author-link-form-input"
           #sharedInput
           matInput
           [type]="'text'"
           [formControl]="formControl"
           [errorStateMatcher]="matcher"
           [placeholder]="placeholderMessage"
           [maxlength]="16"
           (keyup)="inputFieldKeyup($event)">

    <button type="button"
            class="suffix-button"
            (click)="suffixButtonClickEvent($event)">중복확인
    </button>

    <mat-error *ngIf="formControl.hasError('required')">
      <img alt="" class="exclamation"
           src="assets/icons/crackit/exclamation_rounded.svg">
      <span class="message">{{ requiredMessage }}</span>
    </mat-error>

    <mat-error *ngIf="formControl.hasError('min')">
      <img alt="" class="exclamation"
           src="assets/icons/crackit/exclamation_rounded.svg">
      <span class="message">{{ '아이디는 6자 이상 16자 이하로 입력해주세요.' }}</span>
    </mat-error>

    <mat-error *ngIf="formControl.hasError('pattern')">
      <img alt="" class="exclamation"
           src="assets/icons/crackit/exclamation_rounded.svg">
      <span class="message">
        {{ '아이디는 영문 및 숫자 그리고 -와 _를 조합해 입력해주세요.' }}
      </span>
    </mat-error>

  </mat-form-field>
</div>
