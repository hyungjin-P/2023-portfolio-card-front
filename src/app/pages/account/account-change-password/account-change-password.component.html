<div class="account-change-password pd-14">
  <shared-input
    #originalPasswordField
    [type]="passwordType"
    [eyeIcon]="true"
    (isEyeOpened)="passwordTypeToggle(originalPasswordField)"
    [label]="'기존 비밀번호'"
    [hintMessage]="''"
    [maxTextLength]="20"
    [requiredMessage]="'비밀번호를 입력해주세요'"
    [placeholder]="'기존 비밀번호 입력'"
  ></shared-input>

  <shared-input
    #changePasswordField
    [type]="passwordType"
    [eyeIcon]="true"
    (isEyeOpened)="passwordTypeToggle(changePasswordField)"
    [label]="'새 비밀번호'"
    [hintMessage]="''"
    [maxTextLength]="20"
    [requiredMessage]="'비밀번호를 입력해주세요'"
    [placeholder]="'6자리 이상 영문, 숫자로 입력해 주세요.'"
  ></shared-input>

  <shared-input
    #changePasswordConfirmField
    [type]="passwordType"
    [eyeIcon]="true"
    (isEyeOpened)="passwordTypeToggle(changePasswordConfirmField)"
    [label]="'새 비밀번호 확인'"
    [hintMessage]="''"
    [maxTextLength]="20"
    [requiredMessage]="'비밀번호를 입력해주세요'"
    [placeholder]="'비밀번호를 한번 더 입력해 주세요.'"
  ></shared-input>

  <shared-buttons-cancel-save
    [disableSaveButton]="disableSaveButton"
    (clickCancelEmitter)="openCancelConfirm($event)"
    (clickSaveEmitter)="clickSaveButton($event)"
  ></shared-buttons-cancel-save>

</div>
