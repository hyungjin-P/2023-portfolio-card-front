<div class="forgot-password pd-sm">
  <div class="forgot-password-title page-title">비밀번호 찾기</div>
  <div class="forgot-password-description">
    회원가입 시 등록한 이메일 주소를 입력해 주시면, 임시 비밀번호를 발송해 드립니다.
    임시비밀번호로 재로그인 하신 후에, 꼭 비밀번호 재설정을 진행해 주세요.
  </div>

  <div class="forgot-password-input">
    <shared-input
      #forgotPasswordField
      [type]="'email'"
      [label]="''"
      [placeholder]="'가입한 아이디 입력'"
      [requiredMessage]="'이메일 주소를 입력해주세요.'"
      [emailMessage]="'이메일 주소 형식을 확인해주세요.'"
      (inputFieldKeyupEmitter)="toggleButtonStatus()"
    ></shared-input>
  </div>

  <shared-button
    (onClickEmitter)="waitMessage()"
    [disabled]="false"
    [buttonText]="'임시 비밀번호 보내기'"
  ></shared-button>
</div>
