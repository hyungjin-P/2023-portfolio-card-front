<shared-input
  #originalPasswordField
  [type]="passwordType"
  [eyeIcon]="true"
  (isEyeOpened)="passwordTypeToggle(originalPasswordField)"
  [label]="'기존 비밀번호'"
  [hintMessage]="''"
  [maxTextLength]="20"
  [requiredMessage]="'비밀번호를 입력해주세요'"
  [placeholder]="'기존 비밀번호 입력'"
></shared-input>

<shared-input
  #changePasswordField
  [type]="passwordType"
  [eyeIcon]="true"
  (isEyeOpened)="passwordTypeToggle(changePasswordField)"
  [label]="'새 비밀번호'"
  [hintMessage]="''"
  [maxTextLength]="20"
  [requiredMessage]="'비밀번호를 입력해주세요'"
  [placeholder]="'6자리 이상 영문, 숫자로 입력해 주세요.'"
></shared-input>

<shared-input
  #changePasswordConfirmField
  [type]="passwordType"
  [eyeIcon]="true"
  (isEyeOpened)="passwordTypeToggle(changePasswordConfirmField)"
  [label]="'새 비밀번호 확인'"
  [hintMessage]="''"
  [maxTextLength]="20"
  [requiredMessage]="'비밀번호를 입력해주세요'"
  [placeholder]="'비밀번호를 한번 더 입력해 주세요.'"
></shared-input>

<div class="section-buttons">
  <button class="button-cancel button-style-secondary" type="button">
    취소 Cancel
  </button>
  <button class="button-save button-style-primary" type="button">
    저장 Save
  </button>
</div>
